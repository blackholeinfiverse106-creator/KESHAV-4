---
apiVersion: v1
kind: Namespace
metadata:
  name: keshav
  labels:
    name: keshav
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keshav-config
  namespace: keshav
data:
  HOST: "0.0.0.0"
  PORT: "5000"
  DEBUG: "false"
  MAX_CONTENT_MB: "1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keshav-api
  namespace: keshav
  labels:
    app: keshav
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: keshav
      component: api
  template:
    metadata:
      labels:
        app: keshav
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: keshav
        image: keshav:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: keshav-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: keshav-service
  namespace: keshav
  labels:
    app: keshav
spec:
  type: ClusterIP
  selector:
    app: keshav
    component: api
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keshav-hpa
  namespace: keshav
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keshav-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keshav-pdb
  namespace: keshav
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: keshav
      component: api
