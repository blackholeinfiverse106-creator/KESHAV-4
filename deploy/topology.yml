# =============================================================================
# KESHAV-4 Deployment Topology
# Gap 4 — Deployment Readiness: Defines the operational topology.
# =============================================================================
#
# This file describes the deployment architecture for the KESHAV-4
# Propagation Engine within the TANTRA ecosystem.
#
# TOPOLOGY OVERVIEW:
#
#   ┌─────────────────────────────────────────────────────────────────┐
#   │                   TANTRA Pipeline Topology                     │
#   │                                                                 │
#   │  ┌──────────────┐    ┌───────────────────────────────────────┐ │
#   │  │  KESHAV-4     │    │  text-risk-scoring-service            │ │
#   │  │  Propagation  │───▶│  Sūtradhāra Control Plane             │ │
#   │  │  Engine       │    │  ├─ Layer 3: DGIC                     │ │
#   │  │               │    │  ├─ Intelligence Execution            │ │
#   │  │  Port: N/A    │    │  ├─ RAJYA Verification                │ │
#   │  │  (Library)    │    │  ├─ Sarathi Minting                   │ │
#   │  └──────────────┘    │  ├─ Layer 4: Core Execution            │ │
#   │                       │  └─ Layer 5: Bucket Writer             │ │ 
#   │                       │     Port: 8000 (configurable)          │ │
#   │                       └───────────────────────────────────────┘ │
#   │                                         │                       │
#   │                                         ▼                       │
#   │                       ┌───────────────────────────────────────┐ │
#   │                       │  External Bucket Service               │ │
#   │                       │  (Artifact Storage)                    │ │
#   │                       │  Endpoint: BUCKET_SERVICE_URL          │ │
#   │                       └───────────────────────────────────────┘ │
#   └─────────────────────────────────────────────────────────────────┘

# =============================================================================
# Service Definitions
# =============================================================================

services:

  keshav4-propagation-engine:
    description: >
      Stateless dependency propagation and impact analysis engine.
      Computes downstream blast radius via deterministic BFS traversal.
      Exposes a FastAPI service interface.
    type: service
    language: python
    source: C:\blackhole\KESHAV-4
    entry_point: app.main:app
    port: 8081
    dependencies:
      - shared_schemas
    health_check: http://localhost:8081/health
    state: stateless
    notes: >
      No runtime caches, no in-memory persistence, no transient state.
      Every invocation is a pure function of its input.

  text-risk-scoring-service:
    description: >
      The TANTRA pipeline orchestrator. Receives KSML envelopes,
      processes them through Layers 1-5, and writes final artifacts
      to the external Bucket service.
    type: service
    language: python
    source: C:\blackhole\text-risk-scoring-service
    entry_point: app.sutradhara_control_plane.invoke_agent
    port: 8000
    dependencies:
      - keshav4-propagation-engine (via FastAPI HTTP API on port 8081)
      - external-bucket-service
    environment:
      BUCKET_SERVICE_URL: "http://bucket-service:8000"

  external-bucket-service:
    description: >
      Persistent artifact storage. Receives HTTP POST of execution
      records and makes them available for audit and replay.
    type: external
    protocol: HTTP
    endpoints:
      write: POST /bucket/artifact
      read: GET /bucket/artifacts
    port: 8000

# =============================================================================
# Configuration Handling
# =============================================================================

configuration:
  environment_variables:
    BUCKET_SERVICE_URL:
      description: "URL of the external Bucket service for artifact storage"
      required: true
      default: "http://localhost:8000"
      example: "http://bucket-service:8000"

# =============================================================================
# Rollback Behavior
# =============================================================================

rollback:
  strategy: >
    KESHAV-4 is a stateless library with no persistent state to roll back.
    Rollback consists of reverting the Python package/module to the previous
    version. No database migrations, no cache invalidation, no state cleanup.
  steps:
    - "Revert KESHAV-4 source to previous git commit"
    - "Restart the text-risk-scoring-service to reload the module"
    - "Run health check: python -m app.health"
    - "Verify with: pytest shared_tests/ -v"

# =============================================================================
# Security & Auth Posture
# =============================================================================

security:
  authentication: >
    KESHAV-4 is exposed as a network service but relies on internal network routing.
    No direct user-facing auth is implemented. Auth is handled at the service
    ingress layer of consuming systems.
  authorization: >
    The PropagationEngine has no authorization gates. All input validation
    is performed via Pydantic schema enforcement (fail-closed).
  data_sensitivity: >
    Processes task IDs and dependency graphs. No PII, no secrets,
    no encryption keys pass through the engine.

# =============================================================================
# Observability
# =============================================================================

observability:
  health_endpoint: "http://localhost:8081/health"
  metrics:
    - name: propagation_latency_ms
      description: "Time to compute downstream path"
      type: histogram
    - name: impact_score
      description: "Number of impacted tasks per computation"
      type: gauge
    - name: severity_distribution
      description: "Count of LOW/MEDIUM/HIGH severity outputs"
      type: counter
  logging: >
    Engine uses fail-closed exceptions (PropagationContractViolation)
    for all error paths. No silent failures. All errors surface with
    explicit error codes: SCHEMA_MISMATCH, BROKEN_ROOT_CAUSE, INVALID_GRAPH.
