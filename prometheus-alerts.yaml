# KESHAV Alerting Rules (Prometheus)

groups:
  - name: keshav_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: KeshavHighErrorRate
        expr: |
          (
            rate(keshav_request_errors_total[5m]) 
            / 
            rate(keshav_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: keshav
        annotations:
          summary: "KESHAV high error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Critical error rate
      - alert: KeshavCriticalErrorRate
        expr: |
          (
            rate(keshav_request_errors_total[5m]) 
            / 
            rate(keshav_requests_total[5m])
          ) > 0.20
        for: 2m
        labels:
          severity: critical
          service: keshav
        annotations:
          summary: "KESHAV critical error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 20%)"

      # High latency (p95)
      - alert: KeshavHighLatency
        expr: |
          keshav_request_latency_seconds{quantile="0.95"} > 1.0
        for: 5m
        labels:
          severity: warning
          service: keshav
        annotations:
          summary: "KESHAV high latency"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      # Critical latency (p95)
      - alert: KeshavCriticalLatency
        expr: |
          keshav_request_latency_seconds{quantile="0.95"} > 5.0
        for: 2m
        labels:
          severity: critical
          service: keshav
        annotations:
          summary: "KESHAV critical latency"
          description: "P95 latency is {{ $value }}s (threshold: 5s)"

      # Service down
      - alert: KeshavServiceDown
        expr: |
          up{job="keshav"} == 0
        for: 1m
        labels:
          severity: critical
          service: keshav
        annotations:
          summary: "KESHAV service is down"
          description: "KESHAV service has been down for more than 1 minute"

      # Low request rate (possible issue)
      - alert: KeshavLowRequestRate
        expr: |
          rate(keshav_requests_total[5m]) < 0.1
        for: 10m
        labels:
          severity: info
          service: keshav
        annotations:
          summary: "KESHAV low request rate"
          description: "Request rate is {{ $value }} req/s (threshold: 0.1 req/s)"

      # High severity distribution (too many HIGH severity)
      - alert: KeshavHighSeveritySpike
        expr: |
          (
            rate(keshav_severity_total{severity="HIGH"}[5m])
            /
            rate(keshav_requests_total[5m])
          ) > 0.30
        for: 10m
        labels:
          severity: warning
          service: keshav
        annotations:
          summary: "KESHAV high severity spike"
          description: "HIGH severity rate is {{ $value | humanizePercentage }} (threshold: 30%)"

      # Pod restart
      - alert: KeshavPodRestarting
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="keshav"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: keshav
        annotations:
          summary: "KESHAV pod restarting"
          description: "Pod {{ $labels.pod }} is restarting frequently"

      # Memory usage high
      - alert: KeshavHighMemoryUsage
        expr: |
          (
            container_memory_usage_bytes{namespace="keshav", container="keshav"}
            /
            container_spec_memory_limit_bytes{namespace="keshav", container="keshav"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          service: keshav
        annotations:
          summary: "KESHAV high memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 85%)"

      # CPU usage high
      - alert: KeshavHighCPUUsage
        expr: |
          (
            rate(container_cpu_usage_seconds_total{namespace="keshav", container="keshav"}[5m])
            /
            container_spec_cpu_quota{namespace="keshav", container="keshav"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          service: keshav
        annotations:
          summary: "KESHAV high CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} (threshold: 85%)"
