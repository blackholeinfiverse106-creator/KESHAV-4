services:
  keshav-backend:
    image: bhiv/keshav-backend:IMG_TAG
    container_name: bhiv_keshav_backend
    restart: unless-stopped
    ports:
      - "5003:5000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keshav_network

networks:
  keshav_network:
    driver: bridge
